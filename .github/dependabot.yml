version: 2
# Note: Dependabot does NOT bump the `go` directive in go.mod
# (dependabot/dependabot-core#13520 is still open), so there is deliberately no
# stanza for it here — one would be silently inert. Go patch releases are
# security fixes, and go-version-file installs whatever go.mod pins, so the
# `go-toolchain` workflow watches for them and files an issue instead.
updates:
  # Go module dependencies.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions, pinned to commit SHAs — Dependabot bumps the SHA and
  # keeps the "# vX.Y.Z" comment in sync.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
