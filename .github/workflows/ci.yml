name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # weekly, so vuln scans surface new advisories

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Cross-compile for the only supported target; cgo stays off.
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
      - run: go vet ./...

  # Lint the shell scripts (installer, e2e, hooks). The installer runs on
  # users' machines via `curl | sh`, so it is held to the same bar.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck install.sh e2e/*.sh .githooks/commit-msg .githooks/prepare-commit-msg

  commit-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # CI mirror of .githooks/commit-msg: scan every commit message in
      # the repository for AI attribution. Plain Co-authored-by trailers are
      # allowed (GitHub adds them on squash-merge and for Dependabot); an AI
      # co-author is still caught by the name patterns.
      - name: audit commit messages
        run: |
          set -eu
          pattern='claude|anthropic|generated with|ai-assisted'
          matches=$(git log --format='%H %s %b' | grep -icE "$pattern" || true)
          if [ "$matches" -ne 0 ]; then
            echo "commit-audit: forbidden attribution pattern found in commit messages:" >&2
            git log --format='%H %s %b' | grep -iE "$pattern" >&2
            exit 1
          fi
          echo "commit-audit: clean ($(git rev-list --count HEAD) commits scanned)"

  # Secret scanning that works on a private repo today (GitHub secret
  # scanning requires Advanced Security; it takes over when the repo is
  # public). Scans the full commit history.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -eu
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --exit-code 1 .

  # Static analysis (SAST). Four rule classes are excluded as reviewed
  # false-positives for a CLI-wrapping daemon that reads operator config:
  #   G204 subprocess    — the driver's purpose is to exec the `container`
  #                        CLI; commands are constant and args are argv
  #                        arrays (no shell), with a leading-dash guard.
  #   G304 file-by-path  — reads operator-configured TLS/cache/config files.
  #   G703 taint         — sandbox-derived path components pass state.ValidID
  #                        (anchored regex; rejects '/', '.', '..').
  #   G101 hardcoded     — noisy on env-var *name* constants; real secret
  #                        detection is owned by gitleaks and, when public,
  #                        GitHub secret scanning.
  # All crypto/TLS/injection/permission rules stay active.
  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - run: gosec -exclude=G101,G204,G304,G703 -exclude-dir=internal/gen -quiet ./...

  # Known-vulnerability scan of the dependency tree and stdlib, limited to
  # symbols actually reachable from our code.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  dco:
    # Dependabot commits are bot-authored and exempt from DCO (which
    # certifies human contributor rights); a skipped required check is
    # treated as satisfied.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Every non-merge commit in the PR must carry a DCO Signed-off-by
      # trailer (CONTRIBUTING.md). Historical commits are not re-checked.
      - name: check DCO sign-off on PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          bad=0
          for c in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$c" | grep -qi '^Signed-off-by: '; then
              echo "missing Signed-off-by: $c $(git log -1 --format=%s "$c")" >&2
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "dco: add sign-offs with 'git commit -s --amend' or 'git rebase --signoff' (see CONTRIBUTING.md)" >&2
            exit 1
          fi
          echo "dco: all PR commits signed off"
